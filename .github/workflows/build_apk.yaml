name: Build TizenTube Cobalt APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target Architecture"
        required: true
        type: choice
        options:
          - arm64
          - arm
          - both
        default: arm
      build_type:
        description: "Build Type"
        required: true
        type: choice
        options:
          - gold
          - qa
        default: gold
      thin_lto:
        description: "Enable ThinLTO"
        required: false
        type: boolean
        default: true
      use_ccache:
        description: "Enable ccache"
        required: false
        type: boolean
        default: true

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.arch }}" == "both" ]; then
            echo 'targets=["arm64", "arm"]' >> $GITHUB_OUTPUT
          else
            echo 'targets=["${{ inputs.arch }}"]' >> $GITHUB_OUTPUT
          fi

  build:
    needs: matrix-prep
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/src
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,file_stat_matches
      CCACHE_CPP2: "yes"
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.matrix-prep.outputs.targets) }}

    steps:
      - name: Free Disk Space
        run: |
          echo "Initial disk space:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo docker image prune -a -f || true
          echo "Disk space after cleanup:"
          df -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            git curl python3-dev xz-utils file ninja-build openjdk-17-jdk ccache jq

      - name: Set up Depot Tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Install Chromium Build Dependencies
        working-directory: src
        run: |
          sudo ./build/install-build-deps.sh --no-prompt --lib32 --arm

      - name: Configure gclient & Sync Dependencies
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          gclient config --name=src --unmanaged https://github.com/${{ github.repository }}.git
          echo "target_os = ['android']" >> .gclient
          gclient sync -v --no-history --shallow --nohooks
          gclient runhooks -v

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p src/.android
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore src/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp src/.android/debug.keystore "$HOME/.android/debug.keystore"

      - name: Restore ccache
        if: ${{ inputs.use_ccache }}
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/ccache_archive/ccache.tar
          key: ccache-v2-${{ matrix.arch }}-${{ inputs.build_type }}-lto${{ inputs.thin_lto }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v2-${{ matrix.arch }}-${{ inputs.build_type }}-lto${{ inputs.thin_lto }}-
            ccache-v2-${{ matrix.arch }}-${{ inputs.build_type }}-

      - name: Extract ccache
        if: ${{ inputs.use_ccache }}
        run: |
          if [ -f /home/runner/ccache_archive/ccache.tar ]; then
            echo "Extracting restored ccache archive..."
            mkdir -p /home/runner/.cache
            tar -xf /home/runner/ccache_archive/ccache.tar -C /home/runner/.cache
            echo "Extraction complete."
          else
            echo "No previous ccache archive found. Starting fresh."
          fi

      - name: Configure ccache
        if: ${{ inputs.use_ccache }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=8G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=1
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${{ github.workspace }}/src"
          ccache --set-config=sloppiness=time_macros,include_file_mtime,include_file_ctime,file_stat_matches
          ccache --set-config=run_second_cpp=true
          echo "=== ccache configuration ==="
          ccache -p
          echo "=== Initial ccache stats ==="
          ccache -s
          ccache -z

      - name: GN Generate
        working-directory: src
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          EXTRA_ARGS=""
          if [ "${{ inputs.thin_lto }}" == "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --thin-lto"
          fi
          if [ "${{ inputs.use_ccache }}" == "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --use-ccache"
          fi
          python3 cobalt/build/gn.py -p android-${{ matrix.arch }} -c ${{ inputs.build_type }} --no-rbe --no-check $EXTRA_ARGS

      - name: Compile Cobalt APK
        id: compile
        timeout-minutes: 300
        working-directory: src
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          autoninja -C out/android-${{ matrix.arch }}_${{ inputs.build_type }} cobalt_apk

      - name: Print ccache statistics
        if: always() && inputs.use_ccache
        run: |
          echo "=== ccache stats after compile ==="
          ccache -s

      - name: Stop Background Compilers & Archive ccache
        if: always() && inputs.use_ccache
        run: |
          echo "Stopping lingering compiler processes..."
          killall -9 ninja autoninja clang++ clang ccache 2>/dev/null || true
          sync
          sleep 5
          mkdir -p "$CCACHE_DIR"
          find "$CCACHE_DIR" -name "*.tmp.*" -delete 2>/dev/null || true
          find "$CCACHE_DIR" -name "*.lock" -delete 2>/dev/null || true
          sync

          mkdir -p /home/runner/ccache_archive
          echo "Packaging ccache into static archive file..."
          set +e
          tar -cf /home/runner/ccache_archive/ccache.tar -C /home/runner/.cache ccache
          TAR_EXIT=$?
          if [ $TAR_EXIT -ne 0 ] && [ $TAR_EXIT -ne 1 ]; then
            echo "Fatal tar error: $TAR_EXIT"
            exit $TAR_EXIT
          fi
          set -e
          ls -lh /home/runner/ccache_archive/ccache.tar

      - name: Save ccache
        if: always() && inputs.use_ccache
        uses: actions/cache/save@v4
        with:
          path: /home/runner/ccache_archive/ccache.tar
          key: ccache-v2-${{ matrix.arch }}-${{ inputs.build_type }}-lto${{ inputs.thin_lto }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Dump Failure Logs
        if: failure()
        working-directory: src
        run: |
          echo "=== SISO OUTPUT ==="
          cat out/android-${{ matrix.arch }}_${{ inputs.build_type }}/siso_output || true
          echo "=== FAILED COMMANDS ==="
          cat out/android-${{ matrix.arch }}_${{ inputs.build_type }}/siso_failed_commands.sh || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenTubeCobalt-android-${{ matrix.arch }}-${{ inputs.build_type }}
          path: |
            src/out/android-${{ matrix.arch }}_${{ inputs.build_type }}/apks/*.apk
            src/out/android-${{ matrix.arch }}_${{ inputs.build_type }}/*_apk/*.apk
